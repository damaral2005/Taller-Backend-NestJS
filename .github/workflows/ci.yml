name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # En main no se cancela una ejecución en curso: podría cortar un despliegue a medias.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      PORT: 3000
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 5432
      TEST_DB_NAME: inventory_test
      TEST_DB_USERNAME: inventory_test
      TEST_DB_PASSWORD: inventory_test_local
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: inventory_test
          POSTGRES_USER: inventory_test
          POSTGRES_PASSWORD: inventory_test_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory_test -d inventory_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:cov
      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  deploy:
    # Solo despliega lo que llega a main y supera todos los checks de verify.
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.API_URL }}/api/v1/docs
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Desplegar en Railway (build, migraciones y arranque)
        run: npx --yes @railway/cli@5.63.1 up --service "$RAILWAY_SERVICE" --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
      - name: Smoke test de la API publicada
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "$API_URL/api/v1/health")"
          echo "health: $health"
          test "$health" = '{"status":"ok"}'
          curl --fail --silent --show-error "$API_URL/api/v1/docs-json" > /dev/null
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$API_URL/api/v1/products")"
          echo "GET /products sin token: $status"
          test "$status" = "401"