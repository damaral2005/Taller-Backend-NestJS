name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      PORT: 3000
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 5432
      TEST_DB_NAME: inventory_test
      TEST_DB_USERNAME: inventory_test
      TEST_DB_PASSWORD: inventory_test_local
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: inventory_test
          POSTGRES_USER: inventory_test
          POSTGRES_PASSWORD: inventory_test_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory_test -d inventory_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:cov
      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
