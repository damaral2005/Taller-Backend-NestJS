name: taller-backend-nestjs

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-inventory}
      POSTGRES_USER: ${DB_USERNAME:-inventory}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-inventory_local_only}
    ports:
      - '127.0.0.1:${DB_PORT:-5433}:5432'
    volumes:
      - inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 20

  postgres-test:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${TEST_DB_NAME:-inventory_test}
      POSTGRES_USER: ${TEST_DB_USERNAME:-inventory_test}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-inventory_test_local}
    ports:
      - '127.0.0.1:${TEST_DB_PORT:-5434}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  inventory_data:
